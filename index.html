<body><div id="stagingTag" style="position:fixed;top:42%;left:0;z-index:2147483647;pointer-events:none;writing-mode:vertical-rl;background:#d81e28;color:#fff;font:700 11px/1 sans-serif;letter-spacing:2px;padding:6px 3px;border-radius:0 4px 4px 0;box-shadow:0 1px 4px rgba(0,0,0,.5);opacity:.92">測試版</div>
<div id="loader"><b>問道青冥</b><div class="ld-bar"><i id="ldBar"></i></div><span id="ldTxt">載入中 0%</span></div>
<div id="app" class="title-mode">
  <section id="scene">
    <div class="bg" id="bgA"></div><div class="bg" id="bgB"></div>
    <div id="sceneContent"></div>
    <canvas id="fx"></canvas>
    <header id="hud">
      <div id="hudRealm"><span class="seal-sm" id="hudSeal">練</span><div><b id="hudLv"></b><small id="hudRoot"></small></div></div>
      <div id="hudRes"><span><img class="stone-ico" src="assets/ui/stone.webp" alt="靈石"><b id="hudStone">0</b></span><button id="btnBag" class="sealBtn bag" aria-label="行囊"><img src="assets/ui/bag.webp" alt="" onerror="this.remove()"><b>囊</b></button><button id="btnMute" class="sealBtn mute" aria-label="靜音">聲</button><button id="btnSet" class="sealBtn" aria-label="設定">閣</button></div>
    </header>
  </section>
  <section id="controls">
    <div id="ctrlContent"></div>
    <nav id="nav">
      <button data-tab="home"><b>洞</b><small>洞府</small></button>
      <button data-tab="map"><b>歷</b><small>歷練</small></button>
      <button data-tab="alch"><b>丹</b><small>丹房</small></button>
      <button data-tab="arts"><b>功</b><small>功法</small></button>
      <button data-tab="gear"><b>寶</b><small>法寶</small></button>
      <button data-tab="draw"><b>緣</b><small>機緣</small></button>
    </nav>
  </section>
  <div id="dlg" class="hidden"><div id="dlgName"></div><div id="dlgText"></div><i id="dlgNext">▼</i></div>
  <div id="modal" class="hidden"><div class="scroll"><div class="roller"></div><h3 id="mTitle"></h3><div id="mBody"></div><div class="roller"></div></div></div>
  <button id="skipBtn" class="seal sm ghost hidden">跳過</button>
  <div id="toasts"></div>
  <div id="fade"></div>
</div>
<script src="js/asset-list.js"></script>
<script src="js/data.js"></script>

<script src="js/main.js"></script>
